build:
  # You can explicitly set the PHP version you want, e.g. 8.2
  nodes:
    analysis:
      environment:
        php:
          version: 8.5
      project_setup:
        override: true
      tests:
        override:
          - php-scrutinizer-run

filter:
  excluded_paths:
    - tests/*
    - vendor/*

checks:
  php:
    enabled: true

build_failure_conditions:
  - 'issues.severity(>= MAJOR).new.exists'
  - 'project.metric("scrutinizer.quality", < 8)'

tools:
  external_code_coverage:
    timeout: 600
    runs: 3